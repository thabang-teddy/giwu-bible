version: '3.8'

services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: giwu_website
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    networks:
      - giwu_net


  nginx:
    image: nginx:latest
    container_name: giwu_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - website
    networks:
      - giwu_net

networks:
  giwu_net: